name: quickfix
description: Code, then review. For small, well-understood fixes.
stages:
  - key: code
    title: Code
    prompt: prompts/code.md
    reads: [brief.md, issue.md]
    write: ["worktree", "task:implementation.md"]
    produces: implementation.md
    requireCommits: true                  # gate disabled until branch has commits beyond base
    gate: manual
  - key: review
    title: Review
    prompt: prompts/review.md
    pre: ["npm test", "npm run lint", "npx tsc --noEmit"]   # run by the app, output to checks.txt; project `pre` overrides
    reads: [brief.md, implementation.md, checks.txt]   # no plan.md in quickfix
    write: ["task:review.md"]
    produces: review.md
    gate: manual
deny:                                     # applied to every stage by the hook
  - "git push"
  - "git merge"
  - "git rebase"
  - "gh pr merge"
  - "glab mr merge"
  - "git reset --hard"
  - "git checkout main"
